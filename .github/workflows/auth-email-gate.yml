name: Auth Email Gate

on:
  push:
    branches: [feat/auth-email-resend]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Frontend tests
        run: npm run test:web
      - name: Frontend lint
        run: npm run lint:web
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Auth runtime configuration
        run: node --test scripts/tests-auth-runtime-config.test.mjs

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - name: Install API dependencies
        run: python -m pip install -c requirements-dev.lock.txt -e "./apps/api[dev]"
      - name: API tests
        run: python -m pytest apps/api/tests
      - name: API lint
        run: python -m ruff check apps/api
      - name: Auth migration round trip
        working-directory: apps/api
        env:
          WEBDIAG_DATABASE_URL: sqlite+aiosqlite:///auth-migration.sqlite3
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
