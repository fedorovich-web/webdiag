name: WebDiag CI

on:
  push:
    branches:
      - "recovery/**"
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: webdiag-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full verification
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: "true"
      PUBLIC_RELEASE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Create Python virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: npm run python:install

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Verify tool registry
        run: npm run verify:registry

      - name: Run JavaScript tests
        run: npm test

      - name: Lint web app
        run: npm run lint

      - name: Typecheck web app
        run: npm run typecheck

      - name: Build production web app
        run: npm run build

      - name: Run browser tests
        run: npm run test:browser

      - name: Run Python tests
        run: npm run test:python

      - name: Lint Python
        run: npm run lint:python

      - name: Verify Python lock
        run: npm run verify:python-lock

      - name: Upload homepage QA screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homepage-qa-screenshot
          path: apps/web/test-results/homepage-current.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  homepage-visual-qa:
    name: Homepage visual QA
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: "true"
      PUBLIC_RELEASE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build web app
        run: npm --workspace @webdiag/web run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Capture homepage screenshot
        run: npm --workspace @webdiag/web run test:browser -- home-design.spec.ts --grep "Russian homepage exposes the complete site-check journey"

      - name: Upload homepage screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homepage-visual-qa
          path: apps/web/test-results/homepage-current.png
          if-no-files-found: error
          retention-days: 7

  python-locks:
    name: Python locks (3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      PUBLIC_RELEASE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Create Python virtual environment
        run: python -m venv .venv

      - name: Install hashed Python dependencies
        run: npm run python:install

      - name: Verify Python lock and environment
        run: npm run verify:python-lock

      - name: Run Python tests
        run: npm run test:python

      - name: Run Python lint
        run: npm run lint:python

      - name: Check Python dependency consistency
        run: node scripts/run-python.mjs -m pip check

      - name: Verify production Compose policy
        env:
          WEBDIAG_MONITORING_INTERNAL_TOKEN: M123456789012345678901234567890123456789
          WEBDIAG_CRAWLER_INTERNAL_TOKEN: C123456789012345678901234567890123456789
        run: npm run verify:production-compose

      - name: Verify optional production AI Compose policy
        env:
          RABBITMQ_DEFAULT_PASS: ci-rabbit-password-1234567890
          WEBDIAG_MONITORING_INTERNAL_TOKEN: M123456789012345678901234567890123456789
          WEBDIAG_CRAWLER_INTERNAL_TOKEN: C123456789012345678901234567890123456789
          WEBDIAG_AI_INTERNAL_TOKEN: A123456789012345678901234567890123456789
          WEBDIAG_AI_SAFETY_IDENTIFIER_SECRET: S123456789012345678901234567890123456789
          AI_GATEWAY_API_KEY: V123456789012345678901234567890123456789
        run: npm run verify:production-ai-compose

      - name: Build production images
        shell: bash
        run: |
          printf 'WEBDIAG_DOCKER_CONTEXT_SENTINEL=must-not-be-copied\n' > .env.production
          docker build -f apps/api/Dockerfile -t webdiag-api:ci .
          docker build -f apps/worker/Dockerfile -t webdiag-worker:ci .
          docker build --build-arg PUBLIC_RELEASE=true -f apps/web/Dockerfile -t webdiag-web:ci .

      - name: Smoke production Python images
        shell: bash
        run: |
          docker run --rm --entrypoint python webdiag-api:ci -c "from webdiag_api.main import app; assert app.title == 'WebDiag API'"
          docker run --rm --env WEBDIAG_BROKER_BACKEND=stub --entrypoint python webdiag-worker:ci -c "import webdiag_worker.actors as actors; assert actors.health_probe is not None"

      - name: Smoke production web image
        shell: bash
        run: |
          web_container="$(docker run --detach --publish 127.0.0.1:3010:3000 --env PUBLIC_RELEASE=true --env WEBDIAG_API_INTERNAL_URL=http://127.0.0.1:8000 webdiag-web:ci)"
          trap 'docker rm --force "$web_container" >/dev/null 2>&1 || true' EXIT
          robots=""
          for attempt in {1..30}; do
            if robots="$(curl --connect-timeout 2 --max-time 5 --fail --silent --show-error http://127.0.0.1:3010/robots.txt 2>/dev/null)"; then
              break
            fi
            sleep 1
          done
          test -n "$robots"
          grep --fixed-strings 'Allow: /' <<<"$robots"
          grep --fixed-strings 'Sitemap: https://webdiag.ru/sitemap.xml' <<<"$robots"
          if grep --fixed-strings 'Disallow: /' <<<"$robots"; then
            exit 1
          fi
