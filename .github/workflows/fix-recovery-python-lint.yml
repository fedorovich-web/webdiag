name: Fix recovery Python lint

on:
  push:
    branches:
      - recovery/a11.5-github-baseline
    paths:
      - ".github/workflows/fix-recovery-python-lint.yml"

permissions:
  contents: write

jobs:
  fix-python-lint:
    if: github.repository == 'fedorovich-web/webdiag' && github.ref == 'refs/heads/recovery/a11.5-github-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/a11.5-github-baseline
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Create Python virtual environment
        run: python -m venv .venv

      - name: Install locked Python dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          npm run python:install

      - name: Replace FastAPI query defaults with Annotated metadata
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/api/src/webdiag_api/accounts/workspace_api.py")
          source = path.read_text(encoding="utf-8")
          old = '''    category: NormalizedIssueCategory | None = Query(default=None),
              priority: IssuePriority | None = Query(default=None),
              sort: IssueSort = Query(default="priority"),
              order: IssueOrder = Query(default="asc"),
          '''
          new = '''    category: Annotated[NormalizedIssueCategory | None, Query()] = None,
              priority: Annotated[IssuePriority | None, Query()] = None,
              sort: Annotated[IssueSort, Query()] = "priority",
              order: Annotated[IssueOrder, Query()] = "asc",
          '''
          if source.count(old) != 1:
              raise SystemExit("Expected FastAPI Query default block was not found exactly once.")
          path.write_text(source.replace(old, new), encoding="utf-8")

      - name: Apply Ruff safe fixes
        run: .venv/bin/python -m ruff check --fix apps/api apps/worker

      - name: Verify Python lint
        run: npm run lint:python

      - name: Verify Python tests
        run: npm run test:python

      - name: Validate exact Python delta
        shell: pwsh
        run: |
          $expected = @(
            "apps/api/src/webdiag_api/accounts/monitoring_storage.py",
            "apps/api/src/webdiag_api/accounts/workspace_api.py",
            "apps/api/src/webdiag_api/main.py",
            "apps/api/tests/test_account_issues_api.py",
            "apps/api/tests/test_account_workspace_api.py",
            "apps/worker/tests/test_monitoring.py"
          )
          $changed = @(git diff --name-only)
          $delta = Compare-Object ($expected | Sort-Object) ($changed | Sort-Object)
          if ($delta) {
            $delta | Format-Table | Out-String | Write-Host
            throw "Unexpected tracked delta after Ruff fixes."
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw "git diff --check failed."
          }

      - name: Commit verified Python lint fixes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/api/src/webdiag_api/accounts/monitoring_storage.py apps/api/src/webdiag_api/accounts/workspace_api.py apps/api/src/webdiag_api/main.py apps/api/tests/test_account_issues_api.py apps/api/tests/test_account_workspace_api.py apps/worker/tests/test_monitoring.py
          git commit -m "fix(python): satisfy recovered account lint"
          if ($LASTEXITCODE -ne 0) {
            throw "Python lint fix commit failed."
          }
          git push origin HEAD:refs/heads/recovery/a11.5-github-baseline
          if ($LASTEXITCODE -ne 0) {
            throw "Python lint fix push failed."
          }
