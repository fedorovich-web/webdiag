name: Rebaseline recovery visuals

on:
  push:
    branches:
      - recovery/a11.5-github-baseline
    paths:
      - ".github/workflows/rebaseline-visual.yml"

permissions:
  contents: write

jobs:
  rebaseline:
    if: github.repository == 'fedorovich-web/webdiag' && github.ref == 'refs/heads/recovery/a11.5-github-baseline'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "true"
      PUBLIC_RELEASE: "false"

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/a11.5-github-baseline
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build application
        run: npm run build

      - name: Update approved Windows visual snapshots
        run: npm --workspace @webdiag/web run test:browser -- e2e/visual.spec.ts --update-snapshots

      - name: Validate exact snapshot delta
        shell: pwsh
        run: |
          git restore -- apps/web/next-env.d.ts
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to restore generated next-env.d.ts before snapshot validation."
          }
          $expected = @(
            "apps/web/e2e/visual.spec.ts-snapshots/home-ru-light-chromium-win32.png",
            "apps/web/e2e/visual.spec.ts-snapshots/home-ru-dark-chromium-win32.png",
            "apps/web/e2e/visual.spec.ts-snapshots/home-en-light-chromium-win32.png",
            "apps/web/e2e/visual.spec.ts-snapshots/catalog-ru-desktop-chromium-win32.png",
            "apps/web/e2e/visual.spec.ts-snapshots/catalog-ru-mobile-chromium-win32.png",
            "apps/web/e2e/visual.spec.ts-snapshots/json-tool-desktop-chromium-win32.png",
            "apps/web/e2e/visual.spec.ts-snapshots/image-resizer-desktop-chromium-win32.png",
            "apps/web/e2e/visual.spec.ts-snapshots/narrow-header-menu-chromium-win32.png"
          )
          $changed = @(git diff --name-only)
          $delta = Compare-Object ($expected | Sort-Object) ($changed | Sort-Object)
          if ($delta) {
            $delta | Format-Table | Out-String | Write-Host
            throw "Unexpected tracked delta after snapshot generation."
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw "git diff --check failed."
          }

      - name: Commit approved snapshots
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/e2e/visual.spec.ts-snapshots/*-chromium-win32.png
          git commit -m "test(visual): rebaseline recovered Windows snapshots"
          if ($LASTEXITCODE -ne 0) {
            throw "Snapshot commit failed."
          }
          git push origin HEAD:refs/heads/recovery/a11.5-github-baseline
          if ($LASTEXITCODE -ne 0) {
            throw "Snapshot push failed."
          }
