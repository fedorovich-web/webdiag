name: Replace approved homepage hero

on:
  push:
    branches:
      - feature/webdiag-frontend-final-qa
    paths:
      - ".webdiag-transfer/READY"

permissions:
  contents: write

jobs:
  replace-home-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Reconstruct approved WebP
        shell: bash
        run: |
          set -euo pipefail
          cat .webdiag-transfer/home.part.* > /tmp/home.webp.b64
          base64 --decode /tmp/home.webp.b64 > apps/web/public/design/hero/home.webp
          actual="$(sha256sum apps/web/public/design/hero/home.webp | awk '{print $1}')"
          test "$actual" = "dab25da34def5e30ea141852c097d486bbd4ae6ae7d546640be4501696f9ae42"
          test "$(stat -c%s apps/web/public/design/hero/home.webp)" = "209270"
      - name: Commit reconstructed asset and remove transfer files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/design/hero/home.webp
          git rm -r .webdiag-transfer
          git rm .github/workflows/replace-approved-home-hero.yml
          git commit -m "fix(web): restore approved homepage hero WebP"
          git push origin HEAD:feature/webdiag-frontend-final-qa
