name: Temporary Vitest 4 security upgrade

on:
  push:
    branches:
      - audit/vitest-4-security-upgrade

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/vitest-4-security-upgrade
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Upgrade Vitest pins and test transform config
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const paths = [
            'apps/web/package.json',
            'packages/tool-core/package.json',
            'packages/tool-registry/package.json',
          ];
          for (const path of paths) {
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (pkg.devDependencies?.vitest !== '3.2.6') {
              throw new Error(`${path}: expected vitest 3.2.6, got ${pkg.devDependencies?.vitest}`);
            }
            pkg.devDependencies.vitest = '4.1.11';
            fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          }

          const configPath = 'apps/web/vitest.config.ts';
          let config = fs.readFileSync(configPath, 'utf8');
          const marker = 'export default defineConfig({\n  test: {';
          if (!config.includes(marker)) throw new Error('Unexpected Vitest config shape');
          config = config.replace(
            marker,
            'export default defineConfig({\n  oxc: {\n    jsx: {\n      runtime: "automatic",\n    },\n  },\n  test: {',
          );
          fs.writeFileSync(configPath, config);
          NODE
          npm install --package-lock-only --ignore-scripts
          git diff --check
          git diff --stat -- apps/web/package.json packages/tool-core/package.json packages/tool-registry/package.json apps/web/vitest.config.ts package-lock.json

      - name: Verify clean install and advisories
        shell: bash
        run: |
          npm ci
          npm ls vitest @vitest/mocker vite --all
          npm audit --json > full-audit.json || true
          npm audit --omit=dev --json > prod-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const full = JSON.parse(fs.readFileSync('full-audit.json', 'utf8'));
          const prod = JSON.parse(fs.readFileSync('prod-audit.json', 'utf8'));
          const counts = full.metadata?.vulnerabilities ?? {};
          const prodCounts = prod.metadata?.vulnerabilities ?? {};
          console.log(JSON.stringify({ full: counts, production: prodCounts }, null, 2));
          if ((counts.total ?? 0) !== 0) throw new Error('npm advisories remain');
          if ((prodCounts.total ?? 0) !== 0) throw new Error('Production npm advisories remain');
          NODE
          npm install-scripts prune
          pending="$(npm install-scripts ls)"
          printf '%s\n' "$pending"
          grep -Fq 'No packages with unreviewed install scripts.' <<<"$pending"
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const expected = { 'unrs-resolver@1.12.2': true };
          if (JSON.stringify(pkg.allowScripts) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected allowScripts after prune: ${JSON.stringify(pkg.allowScripts)}`);
          }
          NODE
          npm ci

      - name: Run JavaScript verification
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run build

      - name: Run browser regression suite
        run: |
          npx playwright install chromium
          npm run test:browser

      - name: Commit staging result and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-vitest-4-security-upgrade.yml full-audit.json prod-audit.json
          git config user.name "webdiag-audit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/web/package.json packages/tool-core/package.json packages/tool-registry/package.json apps/web/vitest.config.ts package-lock.json .github/workflows/tmp-vitest-4-security-upgrade.yml
          git diff --cached --check
          git commit -m "chore(audit): stage Vitest 4.1.11 security upgrade"
          git push origin HEAD:audit/vitest-4-security-upgrade
