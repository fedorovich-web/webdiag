services:
  rabbitmq:
    image: rabbitmq:4.3.2-management-alpine@sha256:0753b75ce99094c385483d89449d532a0544fb85e4942a478b21cc497ab66d33
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-webdiag}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?set the production RabbitMQ password}"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    environment:
      WEBDIAG_AI_RUNTIME_ENABLED: "true"
      WEBDIAG_AI_INTERNAL_TOKEN: "${WEBDIAG_AI_INTERNAL_TOKEN:?set a distinct AI internal token}"
      WEBDIAG_AI_SAFETY_IDENTIFIER_SECRET: "${WEBDIAG_AI_SAFETY_IDENTIFIER_SECRET:?set a distinct AI safety identifier secret}"
      WEBDIAG_AI_ARTIFACT_STORAGE: s3
      WEBDIAG_AI_ARTIFACT_S3_ENDPOINT_URL: "${WEBDIAG_AI_ARTIFACT_S3_ENDPOINT_URL:?set the private artifact S3 HTTPS endpoint}"
      WEBDIAG_AI_ARTIFACT_S3_REGION: "${WEBDIAG_AI_ARTIFACT_S3_REGION:?set the private artifact S3 region}"
      WEBDIAG_AI_ARTIFACT_S3_BUCKET: "${WEBDIAG_AI_ARTIFACT_S3_BUCKET:?set the private artifact S3 bucket}"
      WEBDIAG_AI_ARTIFACT_PREFIX: "${WEBDIAG_AI_ARTIFACT_PREFIX:-ai-uploads}"
      WEBDIAG_AI_ARTIFACT_S3_ACCESS_KEY_ID: "${WEBDIAG_AI_ARTIFACT_S3_ACCESS_KEY_ID:?set the private artifact S3 access key}"
      WEBDIAG_AI_ARTIFACT_S3_SECRET_ACCESS_KEY: "${WEBDIAG_AI_ARTIFACT_S3_SECRET_ACCESS_KEY:?set the private artifact S3 secret key}"
      WEBDIAG_AI_ARTIFACT_S3_SESSION_TOKEN: "${WEBDIAG_AI_ARTIFACT_S3_SESSION_TOKEN:-}"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    volumes: []
    environment:
      WEBDIAG_BROKER_URL: "amqp://${RABBITMQ_DEFAULT_USER:-webdiag}:${RABBITMQ_DEFAULT_PASS:?set the production RabbitMQ password}@rabbitmq:5672/"
      WEBDIAG_ENVIRONMENT: production
      WEBDIAG_AI_API_INTERNAL_URL: http://api:8000
      WEBDIAG_AI_INTERNAL_TOKEN: "${WEBDIAG_AI_INTERNAL_TOKEN:?set a distinct AI internal token}"
      WEBDIAG_OPENROUTER_API_KEY: "${WEBDIAG_OPENROUTER_API_KEY:?set the OpenRouter API key}"
      WEBDIAG_AI_ARTIFACT_STORAGE: s3
      WEBDIAG_AI_ARTIFACT_S3_ENDPOINT_URL: "${WEBDIAG_AI_ARTIFACT_S3_ENDPOINT_URL:?set the private artifact S3 HTTPS endpoint}"
      WEBDIAG_AI_ARTIFACT_S3_REGION: "${WEBDIAG_AI_ARTIFACT_S3_REGION:?set the private artifact S3 region}"
      WEBDIAG_AI_ARTIFACT_S3_BUCKET: "${WEBDIAG_AI_ARTIFACT_S3_BUCKET:?set the private artifact S3 bucket}"
      WEBDIAG_AI_ARTIFACT_PREFIX: "${WEBDIAG_AI_ARTIFACT_PREFIX:-ai-uploads}"
      WEBDIAG_AI_ARTIFACT_S3_ACCESS_KEY_ID: "${WEBDIAG_AI_ARTIFACT_S3_ACCESS_KEY_ID:?set the private artifact S3 access key}"
      WEBDIAG_AI_ARTIFACT_S3_SECRET_ACCESS_KEY: "${WEBDIAG_AI_ARTIFACT_S3_SECRET_ACCESS_KEY:?set the private artifact S3 secret key}"
      WEBDIAG_AI_ARTIFACT_S3_SESSION_TOKEN: "${WEBDIAG_AI_ARTIFACT_S3_SESSION_TOKEN:-}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy

  monitoring_scheduler:
    environment:
      WEBDIAG_AI_API_INTERNAL_URL: http://api:8000
      WEBDIAG_AI_INTERNAL_TOKEN: "${WEBDIAG_AI_INTERNAL_TOKEN:?set a distinct AI internal token}"

