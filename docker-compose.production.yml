services:
  postgres: !reset null

  rabbitmq:
    restart: unless-stopped
    environment: !override
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-webdiag}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?set the production RabbitMQ password}"

  valkey: !reset null

  api:
    restart: unless-stopped
    volumes: !override
      - account_data:/data
    environment: !override
      WEBDIAG_ENVIRONMENT: production
      WEBDIAG_PUBLIC_RELEASE: "true"
      WEBDIAG_ACCOUNT_DATABASE_PATH: /data/accounts.sqlite3
      WEBDIAG_AUDIT_DATABASE_PATH: /data/audits.sqlite3
      WEBDIAG_AUDIT_HISTORY_LIMIT: "1000"
      WEBDIAG_ACCOUNT_SESSION_TTL_SECONDS: "2592000"
      WEBDIAG_ACCOUNT_ACTIVE_SESSION_LIMIT: "10"
      WEBDIAG_ACCOUNT_COOKIE_SECURE: "true"
      WEBDIAG_ACCOUNT_SCRYPT_N: "32768"
      WEBDIAG_ACCOUNT_SCRYPT_R: "8"
      WEBDIAG_ACCOUNT_SCRYPT_P: "3"
      WEBDIAG_ACCOUNT_SCRYPT_DKLEN: "32"
      WEBDIAG_ACCOUNT_LOGIN_ATTEMPT_LIMIT: "5"
      WEBDIAG_ACCOUNT_LOGIN_ATTEMPT_WINDOW_SECONDS: "900"
      WEBDIAG_ACCOUNT_LOGIN_BLOCK_SECONDS: "900"
      WEBDIAG_MONITORING_INTERNAL_TOKEN: "${WEBDIAG_MONITORING_INTERNAL_TOKEN:?set a distinct monitoring internal token}"
      WEBDIAG_CRAWLER_INTERNAL_TOKEN: "${WEBDIAG_CRAWLER_INTERNAL_TOKEN:?set a distinct crawler internal token}"
      WEBDIAG_AI_INTERNAL_TOKEN: "${WEBDIAG_AI_INTERNAL_TOKEN:?set a distinct AI internal token}"
      WEBDIAG_AI_SAFETY_IDENTIFIER_SECRET: "${WEBDIAG_AI_SAFETY_IDENTIFIER_SECRET:?set a distinct AI safety identifier secret}"
      WEBDIAG_AI_ARTIFACT_STORAGE: s3
      WEBDIAG_AI_ARTIFACT_S3_ENDPOINT_URL: "${WEBDIAG_AI_ARTIFACT_S3_ENDPOINT_URL:?set the private artifact S3 HTTPS endpoint}"
      WEBDIAG_AI_ARTIFACT_S3_REGION: "${WEBDIAG_AI_ARTIFACT_S3_REGION:?set the private artifact S3 region}"
      WEBDIAG_AI_ARTIFACT_S3_BUCKET: "${WEBDIAG_AI_ARTIFACT_S3_BUCKET:?set the private artifact S3 bucket}"
      WEBDIAG_AI_ARTIFACT_PREFIX: "${WEBDIAG_AI_ARTIFACT_PREFIX:-ai-uploads}"
      WEBDIAG_AI_ARTIFACT_S3_ACCESS_KEY_ID: "${WEBDIAG_AI_ARTIFACT_S3_ACCESS_KEY_ID:?set the private artifact S3 access key}"
      WEBDIAG_AI_ARTIFACT_S3_SECRET_ACCESS_KEY: "${WEBDIAG_AI_ARTIFACT_S3_SECRET_ACCESS_KEY:?set the private artifact S3 secret key}"
      WEBDIAG_AI_ARTIFACT_S3_SESSION_TOKEN: "${WEBDIAG_AI_ARTIFACT_S3_SESSION_TOKEN:-}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          body=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5));
          assert body.get('status') == 'ok'
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 20s

  worker:
    restart: unless-stopped
    volumes: !override []
    environment: !override
      WEBDIAG_BROKER_URL: "amqp://${RABBITMQ_DEFAULT_USER:-webdiag}:${RABBITMQ_DEFAULT_PASS:?set the production RabbitMQ password}@rabbitmq:5672/"
      WEBDIAG_ENVIRONMENT: production
      WEBDIAG_MONITORING_API_INTERNAL_URL: http://api:8000
      WEBDIAG_MONITORING_INTERNAL_TOKEN: "${WEBDIAG_MONITORING_INTERNAL_TOKEN:?set a distinct monitoring internal token}"
      WEBDIAG_AI_API_INTERNAL_URL: http://api:8000
      WEBDIAG_AI_INTERNAL_TOKEN: "${WEBDIAG_AI_INTERNAL_TOKEN:?set a distinct AI internal token}"
      WEBDIAG_OPENROUTER_API_KEY: "${WEBDIAG_OPENROUTER_API_KEY:?set the OpenRouter API key}"
      WEBDIAG_AI_ARTIFACT_STORAGE: s3
      WEBDIAG_AI_ARTIFACT_S3_ENDPOINT_URL: "${WEBDIAG_AI_ARTIFACT_S3_ENDPOINT_URL:?set the private artifact S3 HTTPS endpoint}"
      WEBDIAG_AI_ARTIFACT_S3_REGION: "${WEBDIAG_AI_ARTIFACT_S3_REGION:?set the private artifact S3 region}"
      WEBDIAG_AI_ARTIFACT_S3_BUCKET: "${WEBDIAG_AI_ARTIFACT_S3_BUCKET:?set the private artifact S3 bucket}"
      WEBDIAG_AI_ARTIFACT_PREFIX: "${WEBDIAG_AI_ARTIFACT_PREFIX:-ai-uploads}"
      WEBDIAG_AI_ARTIFACT_S3_ACCESS_KEY_ID: "${WEBDIAG_AI_ARTIFACT_S3_ACCESS_KEY_ID:?set the private artifact S3 access key}"
      WEBDIAG_AI_ARTIFACT_S3_SECRET_ACCESS_KEY: "${WEBDIAG_AI_ARTIFACT_S3_SECRET_ACCESS_KEY:?set the private artifact S3 secret key}"
      WEBDIAG_AI_ARTIFACT_S3_SESSION_TOKEN: "${WEBDIAG_AI_ARTIFACT_S3_SESSION_TOKEN:-}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy

  monitoring_scheduler:
    restart: unless-stopped
    environment: !override
      WEBDIAG_ENVIRONMENT: production
      WEBDIAG_MONITORING_API_INTERNAL_URL: http://api:8000
      WEBDIAG_MONITORING_INTERNAL_TOKEN: "${WEBDIAG_MONITORING_INTERNAL_TOKEN:?set a distinct monitoring internal token}"
      WEBDIAG_AI_API_INTERNAL_URL: http://api:8000
      WEBDIAG_AI_INTERNAL_TOKEN: "${WEBDIAG_AI_INTERNAL_TOKEN:?set a distinct AI internal token}"
      WEBDIAG_CRAWLER_API_INTERNAL_URL: http://api:8000
      WEBDIAG_CRAWLER_INTERNAL_TOKEN: "${WEBDIAG_CRAWLER_INTERNAL_TOKEN:?set a distinct crawler internal token}"
    depends_on:
      api:
        condition: service_healthy

  web:
    restart: unless-stopped
    build:
      args:
        PUBLIC_RELEASE: "true"
    environment: !override
      NODE_ENV: production
      PUBLIC_RELEASE: "true"
      WEBDIAG_API_INTERNAL_URL: http://api:8000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/robots.txt')
          .then((response)=>{if(!response.ok)throw new Error('unhealthy')})
          .catch(()=>process.exit(1))
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy

volumes:
  ai_artifacts: !reset null
  postgres_data: !reset null
  valkey_data: !reset null
