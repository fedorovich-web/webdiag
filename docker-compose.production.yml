services:
  postgres: !reset null

  rabbitmq: !reset null

  valkey: !reset null

  api:
    restart: unless-stopped
    volumes: !override
      - account_data:/data
      - ai_artifacts:/var/lib/webdiag-ai-artifacts
    environment: !override
      WEBDIAG_ENVIRONMENT: production
      WEBDIAG_PUBLIC_RELEASE: "true"
      GOOGLE_PAGESPEED_API_KEY: "${GOOGLE_PAGESPEED_API_KEY:-}"
      WEBDIAG_ACCOUNT_DATABASE_PATH: /data/accounts.sqlite3
      WEBDIAG_AUDIT_DATABASE_PATH: /data/audits.sqlite3
      WEBDIAG_AUDIT_HISTORY_LIMIT: "1000"
      WEBDIAG_ACCOUNT_SESSION_TTL_SECONDS: "2592000"
      WEBDIAG_ACCOUNT_ACTIVE_SESSION_LIMIT: "10"
      WEBDIAG_ACCOUNT_COOKIE_SECURE: "true"
      WEBDIAG_ACCOUNT_SCRYPT_N: "32768"
      WEBDIAG_ACCOUNT_SCRYPT_R: "8"
      WEBDIAG_ACCOUNT_SCRYPT_P: "3"
      WEBDIAG_ACCOUNT_SCRYPT_DKLEN: "32"
      WEBDIAG_ACCOUNT_LOGIN_ATTEMPT_LIMIT: "5"
      WEBDIAG_ACCOUNT_LOGIN_ATTEMPT_WINDOW_SECONDS: "900"
      WEBDIAG_ACCOUNT_LOGIN_BLOCK_SECONDS: "900"
      WEBDIAG_ACCOUNT_REGISTRATION_REQUEST_LIMIT: "${WEBDIAG_ACCOUNT_REGISTRATION_REQUEST_LIMIT:-30}"
      WEBDIAG_ACCOUNT_REGISTRATION_WINDOW_SECONDS: "${WEBDIAG_ACCOUNT_REGISTRATION_WINDOW_SECONDS:-60}"
      WEBDIAG_ACCOUNT_REGISTRATION_CONCURRENCY_LIMIT: "${WEBDIAG_ACCOUNT_REGISTRATION_CONCURRENCY_LIMIT:-2}"
      WEBDIAG_ACCOUNT_REGISTRATION_LEASE_SECONDS: "${WEBDIAG_ACCOUNT_REGISTRATION_LEASE_SECONDS:-30}"
      WEBDIAG_MONITORING_INTERNAL_TOKEN: "${WEBDIAG_MONITORING_INTERNAL_TOKEN:?set a distinct monitoring internal token}"
      WEBDIAG_CRAWLER_INTERNAL_TOKEN: "${WEBDIAG_CRAWLER_INTERNAL_TOKEN:?set a distinct crawler internal token}"
      WEBDIAG_CRAWLER_PAGE_LIMIT: "${WEBDIAG_CRAWLER_PAGE_LIMIT:-100}"
      WEBDIAG_CRAWLER_DEADLINE_SECONDS: "${WEBDIAG_CRAWLER_DEADLINE_SECONDS:-240}"
      WEBDIAG_CRAWLER_LEASE_SECONDS: "${WEBDIAG_CRAWLER_LEASE_SECONDS:-300}"
      WEBDIAG_CRAWLER_ACTIVE_JOB_LIMIT_PER_USER: "${WEBDIAG_CRAWLER_ACTIVE_JOB_LIMIT_PER_USER:-2}"
      WEBDIAG_CRAWLER_ACTIVE_JOB_LIMIT_GLOBAL: "${WEBDIAG_CRAWLER_ACTIVE_JOB_LIMIT_GLOBAL:-25}"
      WEBDIAG_AI_RUNTIME_ENABLED: "${WEBDIAG_AI_RUNTIME_ENABLED:-false}"
      WEBDIAG_AI_ARTIFACT_STORAGE: local
      WEBDIAG_AI_ARTIFACT_LOCAL_ROOT: /var/lib/webdiag-ai-artifacts
      WEBDIAG_AI_INTERNAL_TOKEN: "${WEBDIAG_AI_INTERNAL_TOKEN:-}"
      WEBDIAG_AI_SAFETY_IDENTIFIER_SECRET: "${WEBDIAG_AI_SAFETY_IDENTIFIER_SECRET:-}"
      WEBDIAG_ACCOUNT_PUBLIC_ORIGIN: "${WEBDIAG_ACCOUNT_PUBLIC_ORIGIN:-https://app.webdiag.ru}"
      WEBDIAG_ACCOUNT_INTERNAL_TOKEN: "${WEBDIAG_ACCOUNT_INTERNAL_TOKEN:-}"
      WEBDIAG_YANDEX_CLIENT_ID: "${WEBDIAG_YANDEX_CLIENT_ID:-}"
      WEBDIAG_YANDEX_CLIENT_SECRET: "${WEBDIAG_YANDEX_CLIENT_SECRET:-}"
      WEBDIAG_LAVA_API_KEY: "${WEBDIAG_LAVA_API_KEY:-${LAVA_API_KEY:-}}"
      WEBDIAG_LAVA_WEBHOOK_SECRET: "${WEBDIAG_LAVA_WEBHOOK_SECRET:-${LAVA_WEBHOOK_SECRET:-}}"
      WEBDIAG_LAVA_OFFER_ID: "${WEBDIAG_LAVA_OFFER_ID:-${LAVA_OFFER_ID:-}}"
      WEBDIAG_LAVA_SHOP_ID: "${WEBDIAG_LAVA_SHOP_ID:-${LAVA_SHOP_ID:-}}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          body=json.load(urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=5));
          assert body.get('status') == 'ok'
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 20s

  worker: !reset null

  monitoring_scheduler:
    restart: unless-stopped
    environment: !override
      WEBDIAG_ENVIRONMENT: production
      WEBDIAG_MONITORING_API_INTERNAL_URL: http://api:8000
      WEBDIAG_MONITORING_INTERNAL_TOKEN: "${WEBDIAG_MONITORING_INTERNAL_TOKEN:?set a distinct monitoring internal token}"
      WEBDIAG_CRAWLER_API_INTERNAL_URL: http://api:8000
      WEBDIAG_CRAWLER_INTERNAL_TOKEN: "${WEBDIAG_CRAWLER_INTERNAL_TOKEN:?set a distinct crawler internal token}"
      WEBDIAG_CRAWLER_WORKER_TIMEOUT_SECONDS: "${WEBDIAG_CRAWLER_WORKER_TIMEOUT_SECONDS:-270}"
      WEBDIAG_AI_API_INTERNAL_URL: http://api:8000
      WEBDIAG_AI_RUNTIME_ENABLED: "${WEBDIAG_AI_RUNTIME_ENABLED:-false}"
      WEBDIAG_AI_INTERNAL_TOKEN: "${WEBDIAG_AI_INTERNAL_TOKEN:-}"
      AI_PROVIDER: "${AI_PROVIDER:-vercel}"
      AI_GATEWAY_BASE_URL: "${AI_GATEWAY_BASE_URL:-https://ai-gateway.vercel.sh/v1}"
      AI_MODEL: "${AI_MODEL:-openai/gpt-6-luna}"
      AI_REASONING_EFFORT: "${AI_REASONING_EFFORT:-medium}"
      AI_GATEWAY_API_KEY: "${AI_GATEWAY_API_KEY:-}"
      WEBDIAG_AI_ARTIFACT_STORAGE: local
      WEBDIAG_AI_ARTIFACT_LOCAL_ROOT: /var/lib/webdiag-ai-artifacts
    volumes: !override
      - ai_artifacts:/var/lib/webdiag-ai-artifacts
    depends_on:
      api:
        condition: service_healthy

  web:
    restart: unless-stopped
    build:
      args:
        PUBLIC_RELEASE: "true"
    environment: !override
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PUBLIC_RELEASE: "true"
      WEBDIAG_API_INTERNAL_URL: http://api:8000
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      EMAIL_FROM: "${EMAIL_FROM:-WebDiag <no-replay@webdiag.ru>}"
      NEVTAN_SMTP_HOST: "${NEVTAN_SMTP_HOST:-smtp.nevtan.com}"
      NEVTAN_SMTP_PORT: "${NEVTAN_SMTP_PORT:-465}"
      NEVTAN_SMTP_USER: "${NEVTAN_SMTP_USER:-support@webdiag.ru}"
      NEVTAN_SMTP_PASS: "${NEVTAN_SMTP_PASS:-}"
      CONTACT_RECIPIENT_EMAIL: "${CONTACT_RECIPIENT_EMAIL:-support@webdiag.ru}"
      WEBDIAG_YANDEX_CLIENT_ID: "${WEBDIAG_YANDEX_CLIENT_ID:-}"
      WEBDIAG_ACCOUNT_PUBLIC_ORIGIN: "${WEBDIAG_ACCOUNT_PUBLIC_ORIGIN:-https://app.webdiag.ru}"
      WEBDIAG_ACCOUNT_INTERNAL_TOKEN: "${WEBDIAG_ACCOUNT_INTERNAL_TOKEN:-}"
      YANDEX_CLIENT_ID: "${WEBDIAG_YANDEX_CLIENT_ID:-${YANDEX_CLIENT_ID:-}}"
      WEBDIAG_LAVA_WEBHOOK_SECRET: "${WEBDIAG_LAVA_WEBHOOK_SECRET:-}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/robots.txt')
          .then((response)=>{if(!response.ok)throw new Error('unhealthy')})
          .catch(()=>process.exit(1))
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy

volumes:
  ai_artifacts: {}
  postgres_data: !reset null
  valkey_data: !reset null
