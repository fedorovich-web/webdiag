services:
  postgres:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webdiag}
      POSTGRES_USER: ${POSTGRES_USER:-webdiag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webdiag} -d ${POSTGRES_DB:-webdiag}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4.3.2-management-alpine@sha256:0753b75ce99094c385483d89449d532a0544fb85e4942a478b21cc497ab66d33
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-webdiag}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-me}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  valkey:
    image: valkey/valkey:9.1.0-alpine@sha256:c9b77919daeba2c02ad954d0c844cc4e7142069d177b89c5fd771f405daf9e02
    command: ["valkey-server", "--save", "60", "1"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - valkey_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      WEBDIAG_ENVIRONMENT: development
      WEBDIAG_AI_ARTIFACT_STORAGE: local
      WEBDIAG_AI_ARTIFACT_LOCAL_ROOT: /var/lib/webdiag-ai-artifacts
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ai_artifacts:/var/lib/webdiag-ai-artifacts

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      WEBDIAG_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-webdiag}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672/
      WEBDIAG_ENVIRONMENT: development
      WEBDIAG_AI_ARTIFACT_STORAGE: local
      WEBDIAG_AI_ARTIFACT_LOCAL_ROOT: /var/lib/webdiag-ai-artifacts
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ai_artifacts:/var/lib/webdiag-ai-artifacts

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PUBLIC_RELEASE: "false"
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  ai_artifacts:
  postgres_data:
  valkey_data:
